#cloud-config
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - cifs-utils
  - curl
  - fail2ban
  - git
  - jq
  - unattended-upgrades

write_files:
  - path: /usr/local/sbin/fetch-verified-artifact
    owner: root:root
    permissions: "0755"
    content: |
      ${indent(6, verified_fetch_script)}

  - path: /usr/local/sbin/install-verified-codex
    owner: root:root
    permissions: "0755"
    content: |
      ${indent(6, codex_installer_script)}

  - path: /etc/ssh/sshd_config.d/60-codex-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      PermitRootLogin no
      AllowUsers ${admin_username}
      MaxAuthTries 3
      LoginGraceTime 30
      MaxStartups 10:30:60
      X11Forwarding no
      GatewayPorts no
      PermitTunnel no
      AllowTcpForwarding yes

  - path: /etc/fail2ban/jail.d/sshd.local
    owner: root:root
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      backend = systemd
      port = 22
      maxretry = 5
      findtime = 10m
      bantime = 1h

  - path: /usr/local/sbin/bootstrap-codex-on-vm
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      ADMIN_USER="${admin_username}"
      MOUNT_PATH="${workspace_mount_path}"
      STORAGE_ACCOUNT_NAME="${storage_account_name}"
      STORAGE_IDENTITY_CLIENT_ID="${storage_identity_client_id}"
      FILE_SHARE_NAME="${file_share_name}"
      CODEX_VERSION="${codex_version}"
      CODEX_PACKAGE_URL="${codex_package_url}"
      CODEX_PACKAGE_SHA256="${codex_package_sha256}"
      MICROSOFT_REPO_URL="${microsoft_repo_url}"
      MICROSOFT_REPO_SHA256="${microsoft_repo_sha256}"
      AZFILESAUTH_VERSION="${azfilesauth_version}"
      SMB_HOST="$STORAGE_ACCOUNT_NAME.file.core.windows.net"
      SMB_PATH="//$SMB_HOST/$FILE_SHARE_NAME"

      /usr/local/sbin/install-verified-codex \
        "$CODEX_PACKAGE_URL" \
        "$CODEX_PACKAGE_SHA256" \
        "$CODEX_VERSION" \
        /opt/codex \
        /usr/local/bin \
        /usr/local/sbin/fetch-verified-artifact
      command -v codex >/dev/null
      [[ "$(codex --version | awk '{print $NF}')" == "$CODEX_VERSION" ]]

      REPO_PACKAGE=/tmp/packages-microsoft-prod.deb
      /usr/local/sbin/fetch-verified-artifact "$MICROSOFT_REPO_URL" "$MICROSOFT_REPO_SHA256" "$REPO_PACKAGE"
      dpkg -i "$REPO_PACKAGE"
      rm -f "$REPO_PACKAGE"
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y "azfilesauth=${azfilesauth_version}"
      apt-mark hold azfilesauth

      if ! getent passwd azfilesuser >/dev/null; then
        useradd --system --create-home --home-dir /var/lib/azfilesauth --shell /usr/sbin/nologin azfilesuser
      fi
      AUTH_UID="$(id -u azfilesuser)"
      install -d -o azfilesuser -g azfilesuser -m 0700 /var/lib/azfilesauth
      install -d -m 0755 /etc/azfilesauth
      printf 'USER_UID: %s\n' "$AUTH_UID" >/etc/azfilesauth/config.yaml
      chown root:root /etc/azfilesauth/config.yaml
      chmod 0644 /etc/azfilesauth/config.yaml

      systemctl daemon-reload
      systemctl enable azfilesauth-bootstrap.service azfilesrefresh.service
      systemctl start azfilesauth-bootstrap.service
      systemctl start azfilesrefresh.service

      install -d -m 0770 "$MOUNT_PATH"
      USER_UID="$(id -u "$ADMIN_USER")"
      USER_GID="$(id -g "$ADMIN_USER")"
      MOUNT_OPTIONS="_netdev,nofail,vers=3.1.1,sec=krb5,cruid=$AUTH_UID,username=$STORAGE_IDENTITY_CLIENT_ID,serverino,nosharesock,actimeo=30,mfsymlinks,uid=$USER_UID,gid=$USER_GID,dir_mode=0770,file_mode=0660,x-systemd.requires=azfilesauth-bootstrap.service,x-systemd.after=azfilesauth-bootstrap.service"
      FSTAB_ENTRY="$SMB_PATH $MOUNT_PATH cifs $MOUNT_OPTIONS 0 0"
      if ! grep -Fq "$SMB_PATH $MOUNT_PATH cifs " /etc/fstab; then
        printf '%s\n' "$FSTAB_ENTRY" >>/etc/fstab
      fi

      if ! mountpoint -q "$MOUNT_PATH"; then
        mount "$MOUNT_PATH" || mount -a
      fi
      [[ "$(findmnt -n -o FSTYPE "$MOUNT_PATH")" == "cifs" ]]
      [[ "$(findmnt -n -o SOURCE "$MOUNT_PATH")" == "$SMB_PATH" ]]
      test -w "$MOUNT_PATH"

      install -d -m 0755 /var/lib/codex-on-vm
      touch /var/lib/codex-on-vm/bootstrap-ready

  - path: /usr/local/sbin/prepare-azure-files-auth
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      ENDPOINT="https://${storage_account_name}.file.core.windows.net"
      CLIENT_ID="${storage_identity_client_id}"
      for attempt in $(seq 1 60); do
        if azfilesauthmanager set "$ENDPOINT" --imds-client-id "$CLIENT_ID"; then
          azfilesauthmanager list
          exit 0
        fi
        sleep 10
      done
      exit 1

  - path: /etc/systemd/system/azfilesauth-bootstrap.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Prepare Azure Files managed-identity credentials
      Wants=network-online.target
      After=network-online.target
      Before=remote-fs-pre.target azfilesrefresh.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/prepare-azure-files-auth
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

runcmd:
  - [sshd, -t]
  - [systemctl, reload, ssh]
  - [systemctl, enable, --now, fail2ban]
  - [systemctl, enable, --now, unattended-upgrades]
  - [bash, /usr/local/sbin/bootstrap-codex-on-vm]

final_message: "Codex on VM bootstrap complete after $UPTIME seconds"
