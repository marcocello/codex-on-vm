#cloud-config
package_update: true
package_upgrade: true

packages:
  - apparmor-profiles
  - apparmor-utils
  - azure-vm-utils
  - bubblewrap
  - ca-certificates
  - curl
  - e2fsprogs
  - fail2ban
  - git
  - jq
  - parted
  - unattended-upgrades

write_files:
  - path: /usr/local/sbin/fetch-verified-artifact
    owner: root:root
    permissions: "0755"
    content: |
      ${indent(6, verified_fetch_script)}

  - path: /usr/local/sbin/install-verified-codex
    owner: root:root
    permissions: "0755"
    content: |
      ${indent(6, codex_installer_script)}

  - path: /usr/local/sbin/ensure-codex-remote-control
    owner: root:root
    permissions: "0755"
    content: |
      ${indent(6, codex_recovery_script)}

  - path: /etc/systemd/system/codex-remote-control-bootstrap.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Bootstrap the managed Codex Remote Control daemon after boot
      Wants=network-online.target
      After=network-online.target
      ConditionPathIsExecutable=/home/${admin_username}/.codex/packages/standalone/current/codex

      [Service]
      Type=oneshot
      User=${admin_username}
      Group=${admin_username}
      Environment=HOME=/home/${admin_username}
      Environment=CODEX_HOME=/home/${admin_username}/.codex
      ExecStart=/home/${admin_username}/.codex/packages/standalone/current/codex app-server daemon bootstrap --remote-control
      TimeoutStartSec=120

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/codex-remote-control-health.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Ensure the managed Codex Remote Control daemon is ready
      Wants=network-online.target
      After=network-online.target codex-remote-control-bootstrap.service
      ConditionPathIsExecutable=/home/${admin_username}/.codex/packages/standalone/current/codex

      [Service]
      Type=oneshot
      User=${admin_username}
      Group=${admin_username}
      Environment=HOME=/home/${admin_username}
      Environment=CODEX_HOME=/home/${admin_username}/.codex
      ExecStart=/usr/local/sbin/ensure-codex-remote-control
      TimeoutStartSec=240

  - path: /etc/systemd/system/codex-remote-control-health.timer
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Check the managed Codex Remote Control daemon every minute

      [Timer]
      OnBootSec=2min
      OnUnitInactiveSec=1min
      Persistent=true
      RandomizedDelaySec=10s
      Unit=codex-remote-control-health.service

      [Install]
      WantedBy=timers.target

  - path: /etc/ssh/sshd_config.d/60-codex-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      PermitRootLogin no
      AllowUsers ${admin_username}
      MaxAuthTries 3
      LoginGraceTime 30
      MaxStartups 10:30:60
      X11Forwarding no
      GatewayPorts no
      PermitTunnel no
      AllowTcpForwarding no

  - path: /etc/fail2ban/jail.d/sshd.local
    owner: root:root
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      backend = systemd
      port = 22
      maxretry = 5
      findtime = 10m
      bantime = 1h

  - path: /usr/local/sbin/bootstrap-codex-on-vm
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      ADMIN_USER="${admin_username}"
      MOUNT_PATH="${workspace_mount_path}"
      DATA_DISK="/dev/disk/azure/data/by-lun/${workspace_disk_lun}"
      CODEX_VERSION="${codex_version}"
      CODEX_PACKAGE_URL="${codex_package_url}"
      CODEX_PACKAGE_SHA256="${codex_package_sha256}"
      BWRAP_PROFILE_SOURCE="/usr/share/apparmor/extra-profiles/bwrap-userns-restrict"
      BWRAP_PROFILE_TARGET="/etc/apparmor.d/bwrap-userns-restrict"

      command -v bwrap >/dev/null
      command -v apparmor_parser >/dev/null
      [[ -f "$BWRAP_PROFILE_SOURCE" ]]
      install -m 0644 "$BWRAP_PROFILE_SOURCE" "$BWRAP_PROFILE_TARGET"
      apparmor_parser -r "$BWRAP_PROFILE_TARGET"

      ADMIN_HOME="$(getent passwd "$ADMIN_USER" | cut -d: -f6)"
      [[ -d "$ADMIN_HOME" ]]
      ADMIN_CODEX_HOME="$ADMIN_HOME/.codex"
      ADMIN_BIN_DIR="$ADMIN_HOME/.local/bin"
      MANAGED_CODEX="$ADMIN_CODEX_HOME/packages/standalone/current/codex"
      install -d -o "$ADMIN_USER" -g "$ADMIN_USER" -m 0700 "$ADMIN_CODEX_HOME"
      install -d -o "$ADMIN_USER" -g "$ADMIN_USER" -m 0755 "$ADMIN_HOME/.local" "$ADMIN_BIN_DIR"

      runuser -u "$ADMIN_USER" -- env \
        HOME="$ADMIN_HOME" \
        CODEX_HOME="$ADMIN_CODEX_HOME" \
        /usr/local/sbin/install-verified-codex \
          "$CODEX_PACKAGE_URL" \
          "$CODEX_PACKAGE_SHA256" \
          "$CODEX_VERSION" \
          "$ADMIN_CODEX_HOME" \
          "$ADMIN_BIN_DIR" \
          /usr/local/sbin/fetch-verified-artifact
      [[ -x "$ADMIN_HOME/.codex/packages/standalone/current/codex" ]]
      [[ "$(runuser -u "$ADMIN_USER" -- "$MANAGED_CODEX" --version | awk '{print $NF}')" == "$CODEX_VERSION" ]]
      ln -sfn "$ADMIN_BIN_DIR/codex" /usr/local/bin/codex
      [[ "$(runuser -u "$ADMIN_USER" -- /usr/local/bin/codex --version | awk '{print $NF}')" == "$CODEX_VERSION" ]]

      for _attempt in $(seq 1 120); do
        [[ -b "$DATA_DISK" ]] && break
        sleep 5
      done
      [[ -b "$DATA_DISK" ]]

      FILESYSTEM_DEVICE=""
      CREATED_PARTITION=0
      PARTITION="$(lsblk -nrpo NAME,TYPE "$DATA_DISK" | awk '$2 == "part" { print $1; exit }')"
      if [[ -n "$PARTITION" ]]; then
        FILESYSTEM_DEVICE="$PARTITION"
      elif [[ -n "$(blkid -s TYPE -o value "$DATA_DISK" 2>/dev/null || true)" ]]; then
        FILESYSTEM_DEVICE="$DATA_DISK"
      else
        [[ -z "$(wipefs --no-act "$DATA_DISK" 2>/dev/null)" ]]
        parted "$DATA_DISK" --script mklabel gpt mkpart primary ext4 0% 100%
        partprobe "$DATA_DISK"
        udevadm settle
        PARTITION="$(lsblk -nrpo NAME,TYPE "$DATA_DISK" | awk '$2 == "part" { print $1; exit }')"
        [[ -b "$PARTITION" ]]
        FILESYSTEM_DEVICE="$PARTITION"
        CREATED_PARTITION=1
      fi
      [[ -b "$FILESYSTEM_DEVICE" ]]

      FILESYSTEM_TYPE="$(blkid -s TYPE -o value "$FILESYSTEM_DEVICE" 2>/dev/null || true)"
      if [[ -z "$FILESYSTEM_TYPE" ]]; then
        [[ "$CREATED_PARTITION" == "1" ]]
        mkfs.ext4 -L codex-workspace "$FILESYSTEM_DEVICE"
        FILESYSTEM_TYPE=ext4
      fi
      [[ "$FILESYSTEM_TYPE" == "ext4" ]]
      FILESYSTEM_UUID="$(blkid -s UUID -o value "$FILESYSTEM_DEVICE")"
      [[ -n "$FILESYSTEM_UUID" ]]

      install -d -o "$ADMIN_USER" -g "$ADMIN_USER" -m 0770 "$MOUNT_PATH"
      sed -i "\\|[[:space:]]$MOUNT_PATH[[:space:]]|d" /etc/fstab
      printf 'UUID=%s %s ext4 defaults,nofail,x-systemd.device-timeout=2min 0 2\n' "$FILESYSTEM_UUID" "$MOUNT_PATH" >>/etc/fstab
      mountpoint -q "$MOUNT_PATH" || mount "$MOUNT_PATH"
      [[ "$(findmnt -n -o FSTYPE "$MOUNT_PATH")" == "ext4" ]]
      chown "$ADMIN_USER:$ADMIN_USER" "$MOUNT_PATH"
      chmod 0770 "$MOUNT_PATH"

      if ! runuser -u "$ADMIN_USER" -- env \
        HOME="$ADMIN_HOME" \
        CODEX_HOME="$ADMIN_CODEX_HOME" \
        "$MANAGED_CODEX" app-server daemon bootstrap --remote-control; then
        printf 'Remote Control bootstrap requires user authentication; installing the managed daemon without Remote Control.\n' >&2
        runuser -u "$ADMIN_USER" -- env \
          HOME="$ADMIN_HOME" \
          CODEX_HOME="$ADMIN_CODEX_HOME" \
          "$MANAGED_CODEX" app-server daemon bootstrap
      fi

      systemctl daemon-reload
      systemctl enable codex-remote-control-bootstrap.service codex-remote-control-health.timer
      systemctl start codex-remote-control-health.timer

      install -d -m 0755 /var/lib/codex-on-vm
      touch /var/lib/codex-on-vm/bootstrap-ready

runcmd:
  - [sshd, -t]
  - [systemctl, reload, ssh]
  - [systemctl, enable, --now, fail2ban]
  - [systemctl, enable, --now, unattended-upgrades]
  - [bash, /usr/local/sbin/bootstrap-codex-on-vm]

final_message: "Codex on VM bootstrap complete after $UPTIME seconds"
